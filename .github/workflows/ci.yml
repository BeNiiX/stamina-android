name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unit tests (conformance scenarios skip without the mock server)
        run: ./gradlew :stamina:testDebugUnitTest --no-daemon --console=plain
      - name: Publishable artifact
        run: ./gradlew :stamina:publishToMavenLocal -x test --no-daemon --console=plain && ls ~/.m2/repository/io/getstamina/stamina-android/
